<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP PRO</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e1e4e8;
  --accent: #0b6bcb; --accent-text: #ffffff; --warn-bg: #fff4d6; --warn: #7a5200; --bad: #b42318; --good: #1a7f37;
  --chip: #eef1f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
    --accent: #5aa7f0; --accent-text: #0b1520; --warn-bg: #3a2f12; --warn: #f2c66d; --bad: #ff7b72; --good: #56d364;
    --chip: #232a33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
nav button.on { background: var(--chip); color: var(--text); font-weight: 600; }
#state { margin-left: auto; color: var(--muted); font-size: 12px; }
main { padding: 16px; max-width: 1100px; margin: 0 auto; }
section { display: none; } section.on { display: block; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.bar .grow { flex: 1; }
button.act { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
button.act:disabled { opacity: .5; cursor: default; }
input, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0; margin-bottom: 16px; overflow: hidden; }
.card h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 6px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.addr, .muted { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 16px; }
.msg { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; background: var(--warn-bg); color: var(--warn); }
.err { color: var(--bad); }
.ok { color: var(--good); }
.note { color: var(--muted); font-size: 12px; }
/* configuration page */
.subnav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.subnav button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 4px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
.subnav button.on { background: var(--chip); color: var(--text); font-weight: 600; }
.subnav.small button { font-size: 12px; padding: 3px 8px; }
.cfg td { vertical-align: middle; }
.cfg td.lbl { width: 42%; }
.cfg td.rng { color: var(--muted); font-size: 12px; }
#cfg-out .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.cfg input[type=number] { width: 7.5em; text-align: right; }
.cfg .date input[type=number] { width: 4.5em; }
.cfg tr.changed td { background: var(--warn-bg); }
.cfg .unit { color: var(--muted); font-size: 12px; margin-left: 4px; }
.badge { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
.cfg .fieldmsg { display: block; font-size: 12px; }
.problems { margin: 0 0 12px; padding: 10px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
.problems li { margin-left: 16px; }
#cfg-write { position: sticky; bottom: 0; }
#cfg-write .inner { padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>SP PRO</h1>
  <nav id="tabs">
    <button data-tab="live" class="on">Live</button>
    <button data-tab="settings">Configuration</button>
    <button data-tab="backups">Backups</button>
    <button data-tab="logs">Logs</button>
    <button data-tab="status">Status</button>
  </nav>
  <span id="state"></span>
</header>
<main>
  <div id="banner"></div>

  <section id="live" class="on">
    <div class="bar">
      <select id="screens">
        <option value="now,today">Now + Today</option>
        <option value="tech">Technical</option>
        <option value="dc,ac,ac2">History</option>
        <option value="service,unit">Service + Unit</option>
        <option value="settings">Service settings screen</option>
        <option value="now,today,tech,dc,ac,ac2,service,unit">Everything</option>
      </select>
      <label class="muted"><input type="checkbox" id="auto" checked> refresh every 15 s</label>
      <span class="grow"></span><span class="note" id="live-at"></span>
      <button class="act" id="live-go">Refresh</button>
    </div>
    <div id="live-out"></div>
  </section>

  <section id="settings">
    <div class="bar">
      <input id="cfg-filter" placeholder="Search settings" class="grow">
      <label class="muted"><input type="checkbox" id="cfg-factory"> show hidden</label>
      <label class="muted"><input type="checkbox" id="cfg-rawview"> raw list</label>
      <span class="note" id="cfg-at"></span>
      <button class="act" id="cfg-go">Read from SP PRO</button>
    </div>
    <div id="cfg-msg"></div>
    <div id="cfg-tabs" class="subnav"></div>
    <div id="cfg-subtabs" class="subnav small"></div>
    <div id="cfg-out"><p class="note">Read the configuration to see it as SP LINK shows it.</p></div>
    <div class="card" id="cfg-write" style="display:none"><div class="inner" id="cfg-write-in"></div></div>
  </section>

  <section id="backups">
    <div class="bar">
      <span class="note grow" id="bk-sched"></span>
      <button class="act" id="bk-go">Back up now</button>
    </div>
    <div class="card"><h2>Compare</h2>
      <div class="bar" style="padding:10px 12px;margin:0">
        <select id="bk-a"></select><span class="muted">→</span><select id="bk-b"></select>
        <button class="act" id="bk-diff">Show changes</button>
      </div>
      <div id="diff-out"></div>
    </div>
    <div class="card"><h2>Saved backups</h2><div class="scroll" id="bk-out"></div></div>
  </section>

  <section id="logs">
    <div class="card" style="padding:12px">
      <div class="bar">
        <label>From <input type="date" id="lg-since"></label>
        <label>To <input type="date" id="lg-until"></label>
      </div>
      <div class="bar">
        <label><input type="checkbox" class="lg" value="events" checked> Events</label>
        <label><input type="checkbox" class="lg" value="alerts" checked> Alerts</label>
        <label><input type="checkbox" class="lg" value="daily" checked> Daily summary</label>
        <label><input type="checkbox" class="lg" value="detailed"> Detailed (large)</label>
        <span class="grow"></span>
        <button class="act" id="lg-go">Download</button>
      </div>
      <p class="note">SP LINK-format CSVs in a zip. The SP PRO serves one download at a time; this waits if SP LINK or the installer is downloading.</p>
      <div id="lg-out"></div>
    </div>
  </section>

  <section id="status"><div class="card"><div id="st-out"></div></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, opts = {}) {
  const ctrl = new AbortController();                 // give up rather than spin forever if the link is wedged
  const t = setTimeout(() => ctrl.abort(), opts.timeout || 90000);
  try {
    const r = await fetch(path, {...opts, signal: ctrl.signal});
    const ct = r.headers.get('content-type') || '';
    const body = ct.includes('json') ? await r.json() : null;
    if (!r.ok) throw new Error((body && body.error) || r.statusText);
    return body;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('timed out — the SP PRO link may be busy; try again');
    throw e;
  } finally { clearTimeout(t); }
}
function show(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === tab));
  if (tab === 'settings' && !READ) cfgRead();
  if (tab === 'backups') loadBackups();
  history.replaceState(null, '', '#' + tab + (tab === 'settings' && curTab ? '/' + curTab : ''));
  if (tab === 'status') loadStatus();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));

// ---- live
const SCREEN = {NowSubTab:'Now', TodaySubTab:'Today', TechnicalDataSubTab:'Technical', DCHistorySubTab:'DC history',
  ACHistorySubTab:'AC history', ACHistorySubTab2:'AC history 2', ServiceReadings1:'Service', ServiceSettings:'Service settings',
  Now_Today_Tech_KacoModelsCapacityAndOEM:'Unit'};
let liveBusy = false;
async function loadLive() {
  if (liveBusy) return; liveBusy = true;
  try {
    const d = await api('api/live?screens=' + $('#screens').value);
    $('#banner').innerHTML = d.version_problems.length ? `<div class="msg">This unit differs from the verified memory map (${esc(d.version_problems.join(', '))}); values may be wrong.</div>` : '';
    const groups = {};
    d.rows.forEach(r => (groups[r.screen] = groups[r.screen] || []).push(r));
    $('#live-out').innerHTML = '<div class="grid">' + Object.entries(groups).map(([s, rows]) =>
      `<div class="card"><h2>${esc(SCREEN[s] || s)}</h2><table>${rows.map(r =>
        `<tr><td>${esc(r.label)}</td><td class="num">${esc(r.text)} <span class="muted">${esc(r.unit)}</span></td></tr>`).join('')}</table></div>`).join('') + '</div>';
    $('#live-at').textContent = 'read ' + d.at.slice(11);
  } catch (e) { $('#live-at').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  liveBusy = false;
}
$('#live-go').onclick = loadLive; $('#screens').onchange = loadLive;
setInterval(() => { if ($('#auto').checked && $('#live').classList.contains('on') && !document.hidden) loadLive(); }, 15000);

// ---- configuration (SP LINK's Configuration Settings screens)
let LAYOUT = null, READ = null, EDITS = {}, NOTES = {}, CHECK = null, curTab = null, curSub = null, checkTimer = null;
async function cfgLayout() { if (!LAYOUT) LAYOUT = await api('api/config/layout'); return LAYOUT; }
const visTabs = () => LAYOUT.tabs.filter(t => (t.title || t.id) && ($('#cfg-factory').checked || !LAYOUT.hidden_tabs.includes(t.title)));
function currentText(name) { const v = READ && READ.values[name]; return v ? v.text : ''; }
function control(name) {
  const m = LAYOUT.settings[name] || {}, v = READ.values[name];
  if (!v) return '<span class="muted">not read</span>';
  if (m.installer_only) return `<span>${esc(v.text)}</span> <span class="badge" title="SP LINK keeps this behind the installer code (AS4777 grid-protection / power quality). selpi shows it but keeps it read-only.">installer&nbsp;only &middot; read-only</span>`;
  if (m.factory_only) return `<span>${esc(v.text)}</span> <span class="badge" title="SP LINK keeps this behind a factory passcode (Selectronic factory calibration). selpi shows it but keeps it read-only.">factory &middot; read-only</span>`;
  if (m.min_version && READ.config_version != null && READ.config_version < m.min_version)
    return `<span class="muted">${esc(v.text)}</span> <span class="badge" title="This setting needs SP PRO config-settings version ${m.min_version}; this unit is ${READ.config_version}. SP LINK greys it out on older firmware.">needs&nbsp;firmware&nbsp;v${m.min_version}</span>`;
  if (!READ.writes_available) return `<span>${esc(v.text)}</span>`;   // read-only release: viewer only
  const ed = EDITS[name], dis = m.words === 2 ? ' disabled title="spans two words"' : '';
  if (m.kind === 'enum') {
    const cur = ed !== undefined ? ed : v.value;
    return `<select data-s="${esc(name)}"${dis}>${Object.entries(m.values).map(([c, l]) =>
      `<option${l === cur ? ' selected' : ''}>${esc(l)}</option>`).join('')}${Object.values(m.values).includes(cur) ? '' : `<option selected>${esc(cur)}</option>`}</select>`;
  }
  if (m.kind === 'time') {
    const cur = ed !== undefined ? ed : v.value;
    const off = m.disabled !== undefined;
    return `<input type="time" data-s="${esc(name)}" value="${cur === 'Disabled' ? '' : esc(cur)}"${cur === 'Disabled' ? ' disabled' : ''}>` +
      (off ? ` <label class="muted"><input type="checkbox" data-off="${esc(name)}"${cur === 'Disabled' ? ' checked' : ''}> disabled</label>` : '');
  }
  if (m.kind === 'pf') {      // a number + Lagging / Leading, stored as one signed word
    const [num, dir] = String(ed !== undefined ? ed : v.value).split(' ');
    return `<input type="number" data-s="${esc(name)}" data-part="num" value="${esc(num)}" step="${m.step || 0.01}">` +
      `${m.unit ? `<span class="unit">${esc(m.unit)}</span>` : ''} <select data-s="${esc(name)}" data-part="dir">${m.directions.map(d =>
      `<option${d === dir ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select>`;
  }
  if (m.kind === 'number') {
    const cur = ed !== undefined ? ed : v.value;
    const step = m.step || (m.decimals ? Math.pow(10, -m.decimals) : 1);
    // no hard min/max on the element: a pre-existing value below SP LINK's editable minimum (e.g. an equalise time
    // from a BMS open-loop doc) is valid and must display cleanly; held() still pulls an *edit* into range.
    return `<input type="number" data-s="${esc(name)}" value="${esc(cur)}" step="${step}"${dis}><span class="unit">${esc(m.unit || '')}</span>`;
  }
  const cur = ed !== undefined ? ed : (m.kind === 'daymonth' ? v.text : v.raw);
  return `<input data-s="${esc(name)}" value="${esc(cur)}" size="10"${dis}>${m.kind === 'raw' ? '<span class="unit">raw</span>' : ''}`;
}
function rowHtml(r, where) {
  const names = r.month ? [r.setting, r.month] : [r.setting];      // a day/month date: two settings, one row
  const msgs = names.map(n => CHECK && CHECK.changes[n]).filter(Boolean).map(c =>
    [...(c.warnings || []).map(w => `<span class="fieldmsg" style="color:var(--warn)">${esc(w)}</span>`),
     c.error ? `<span class="fieldmsg err">${esc(c.error)}</span>` : ''].join('')).join('');
  const held = names.filter(n => NOTES[n]).map(n => `<span class="fieldmsg" style="color:var(--warn)">${esc(NOTES[n])}</span>`).join('');
  const changed = names.some(n => EDITS[n] !== undefined);
  const was = changed ? `<span class="fieldmsg muted">was ${esc(names.map(currentText).join(' '))}</span>` : '';
  const ctl = r.month ? `<span class="date">${control(r.setting)} ${control(r.month)}</span>` : control(r.setting);
  return `<tr class="${changed ? 'changed' : ''}"><td class="lbl">${esc(r.label || r.setting)}${where ? `<div class="muted">${esc(where)}</div>` : ''}</td>` +
    `<td>${ctl}${was}${held}${msgs}</td><td class="rng">${esc(r.month ? '' : (r.range || ''))}</td></tr>`;
}
const CAT_LABEL = {legacy: 'legacy', unreleased: 'experimental', advanced: 'advanced'};
const groupShown = g => !g.visibility || $('#cfg-factory').checked;
const catBadge = g => g.visibility ? ` <span class="badge" title="SP LINK hides this group (${esc(g.visibility === 'legacy' ? 'legacy settings, off by default' : g.visibility === 'unreleased' ? 'unreleased / experimental feature' : 'advanced view')}).">${esc(CAT_LABEL[g.visibility] || g.visibility)}</span>` : '';
function drawCfg() {
  if ($('#cfg-rawview').checked) return drawRaw();
  if (!LAYOUT || !READ) return;
  const f = $('#cfg-filter').value.trim().toLowerCase();
  const tabs = visTabs();
  if (f) {   // search across every tab
    $('#cfg-tabs').innerHTML = ''; $('#cfg-subtabs').innerHTML = '';
    const rows = [];
    tabs.forEach(t => t.subtabs.forEach(st => st.groups.filter(groupShown).forEach(g => g.rows.forEach(r => {
      const where = [t.title, st.title, g.title].filter(Boolean).join(' › ');
      if ((r.label || '').toLowerCase().includes(f) || r.setting.toLowerCase().includes(f) || where.toLowerCase().includes(f)) rows.push([r, where]);
    }))));
    $('#cfg-out').innerHTML = rows.length ? `<div class="card"><div class="scroll"><table class="cfg">${rows.map(([r, w]) => rowHtml(r, w)).join('')}</table></div></div>`
      : '<p class="note">No setting matches.</p>';
  } else {
    if (!tabs.find(t => t.id === curTab)) curTab = tabs[0].id;
    $('#cfg-tabs').innerHTML = tabs.map(t => `<button data-t="${esc(t.id)}" class="${t.id === curTab ? 'on' : ''}">${esc(t.title || t.id)}</button>`).join('');
    const tab = tabs.find(t => t.id === curTab);
    if (!tab.subtabs.find(st => st.id === curSub)) curSub = tab.subtabs[0].id;
    $('#cfg-subtabs').innerHTML = tab.subtabs.length > 1 ? tab.subtabs.map(st =>
      `<button data-st="${esc(st.id)}" class="${st.id === curSub ? 'on' : ''}">${esc(st.title || '-')}</button>`).join('') : '';
    const sub = tab.subtabs.find(st => st.id === curSub);
    $('#cfg-out').innerHTML = '<div class="grid">' + sub.groups.filter(groupShown).map(g => `<div class="card"><h2>${esc(g.title || tab.title)}${catBadge(g)}</h2>` +
      `<table class="cfg">${g.rows.filter(r => !r.hidden || $('#cfg-factory').checked).map(r => rowHtml(r)).join('')}</table></div>`).join('') + '</div>';
  }
  drawWrite();
}
function drawRaw() {
  $('#cfg-tabs').innerHTML = ''; $('#cfg-subtabs').innerHTML = '';
  if (!READ) return;
  const f = $('#cfg-filter').value.toLowerCase();
  const rows = Object.entries(READ.values).filter(([n]) => !f || n.toLowerCase().includes(f)).sort();
  $('#cfg-out').innerHTML = `<div class="card"><div class="scroll"><table>${rows.map(([n, v]) =>
    `<tr><td>${esc(n)}</td><td>${esc(v.text)}</td><td class="num">${esc(v.raw)}</td></tr>`).join('')}</table></div></div>`;
}
function problemsHtml(title, list) {
  return list.length ? `<div class="problems"><b>${esc(title)}</b><ul>${list.map(p =>
    `<li><span class="${p.severity === 'error' ? 'err' : ''}">${esc(p.severity)}</span>: ${esc(p.message)} <span class="muted">[${esc(p.id)}]</span></li>`).join('')}</ul></div>` : '';
}
function drawWrite() {
  const names = Object.keys(EDITS);
  if (!READ.writes_available) { $('#cfg-write').style.display = 'none'; return; }
  $('#cfg-write').style.display = names.length ? '' : 'none';
  if (!names.length) return;
  const probs = CHECK ? [...CHECK.problems, ...CHECK.send_problems] : [];
  const errors = probs.filter(p => p.severity === 'error');
  const bad = CHECK && Object.values(CHECK.changes).some(c => c.error);
  const off = !READ.writes_allowed;
  $('#cfg-write-in').innerHTML = `<b>${names.length} change${names.length > 1 ? 's' : ''}</b><table class="cfg">${names.map(n =>
    `<tr><td>${esc(n)}</td><td>${esc(currentText(n))} → <b>${esc(CHECK && CHECK.changes[n] && CHECK.changes[n].text || EDITS[n])}</b></td></tr>`).join('')}</table>` +
    (CHECK ? problemsHtml("SP LINK's checks on these changes", probs) || '<p class="ok">SP LINK\'s checks: no problems.</p>' : '<p class="note">checking…</p>') +
    (off ? '<p class="note">Writing is off: turn on the app option <b>allow_config_writes</b> to write from here.</p>' : `
    <div class="bar">
      ${errors.length ? '<label class="err"><input type="checkbox" id="cfg-ign"> write although SP LINK would refuse</label>' : ''}
      <input type="password" id="cfg-pass" placeholder="SP LINK passcode" autocomplete="off" size="14">
      <button class="act" id="cfg-do"${bad || !CHECK ? ' disabled' : ''}>Write to SP PRO</button>
      <button id="cfg-undo">Discard changes</button>
    </div><div id="cfg-res"></div>`) + (off ? '<button id="cfg-undo">Discard changes</button>' : '');
  $('#cfg-undo').onclick = () => { EDITS = {}; NOTES = {}; CHECK = null; drawCfg(); };
  if (!off) $('#cfg-do').onclick = doWrite;
}
function edited(name, text) {
  if (text === currentText(name) || (READ.values[name] && String(READ.values[name].value) === String(text))) delete EDITS[name];
  else EDITS[name] = text;
  clearTimeout(checkTimer);
  checkTimer = setTimeout(runCheck, 400);
  drawWrite();
}
async function runCheck() {
  if (!Object.keys(EDITS).length) { CHECK = null; drawCfg(); return; }
  try {
    CHECK = await api('api/config/check', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({read_id: READ.read_id, changes: EDITS})});
  } catch (e) { CHECK = null; $('#cfg-msg').innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  drawCfg();
}
async function doWrite() {
  const pass = $('#cfg-pass').value;
  if (!pass) { $('#cfg-res').innerHTML = '<p class="err">Enter the SP LINK passcode.</p>'; return; }
  const list = Object.keys(EDITS).map(n => `${n}: ${currentText(n)} → ${CHECK.changes[n].text}`).join('\n');
  if (!confirm(`Write ${Object.keys(EDITS).length} setting(s) to the SP PRO?\n\n${list}\n\nA full backup is saved first; the configuration is read back afterwards.`)) return;
  const errors = [...CHECK.problems, ...CHECK.send_problems].filter(p => p.severity === 'error');
  const ignore = $('#cfg-ign') && $('#cfg-ign').checked ? errors.map(p => p.id) : [];
  $('#cfg-do').disabled = true; $('#cfg-res').innerHTML = '<p class="note">writing…</p>';
  try {
    const r = await api('api/config/write', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({read_id: READ.read_id, changes: EDITS, passcode: pass,
                            ignore_rules: ignore})});
    const others = Object.keys(r.other_changes || {});
    const note = `<div class="msg">Written: ${esc(r.changes.map(c => `${c.setting} ${c.old} → ${c.new}${c.confirmed ? '' : ' (NOT confirmed)'}`).join('; '))}.` +
      ` Backup ${esc(r.backup)}.${others.length ? ' Other words changed: ' + esc(others.join(', ')) : ''}</div>`;
    EDITS = {}; CHECK = null;
    await cfgRead(note);
  } catch (e) { $('#cfg-res').innerHTML = `<p class="err">${esc(e.message)}</p>`; $('#cfg-do').disabled = false; }
}
let cfgBusy = false, cfgTimer = null;
async function cfgRead(note) {
  if (cfgBusy) return;          // a read is already in flight: don't start a second (two timers + both fight the link)
  cfgBusy = true;
  $('#cfg-go').disabled = true;
  const t0 = Date.now(), tick = () => { const s = Math.round((Date.now() - t0) / 1000);
    $('#cfg-at').textContent = `reading the configuration… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  clearInterval(cfgTimer);      // never leave a previous timer running
  tick(); cfgTimer = setInterval(tick, 1000);
  try {
    await cfgLayout();
    READ = await api('api/config/read');
    READ.at = new Date();
    $('#cfg-at').textContent = `${READ.model || '?'} · read ${READ.at.toTimeString().slice(0, 8)}`;
    const ro = !READ.writes_available ? `<div class="msg">Read-only release: selpi shows the configuration as SP LINK does but does not write it yet (configuration writes arrive after on-hardware validation).</div>` : '';
    const vp = READ.version_problems.length ? `<div class="msg">This unit differs from the verified versions (${esc(READ.version_problems.join(', '))}). ${READ.map_mismatch ? 'Its memory map differs, so setting addresses may be wrong and writing is refused.' : 'The addresses still match (same memory map); firmware-specific settings are flagged, and writing works for the settings your firmware has.'}</div>` : '';
    $('#cfg-msg').innerHTML = (typeof note === 'string' ? note : '') + ro + vp + problemsHtml("Already in the unit's configuration (SP LINK would flag these)", READ.problems);
    EDITS = {}; NOTES = {}; CHECK = null;
    drawCfg();
  } catch (e) { $('#cfg-at').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  finally {
    clearInterval(cfgTimer); cfgTimer = null;
    $('#cfg-go').disabled = false;
    cfgBusy = false;
  }
}
setInterval(() => {   // a write needs a recent read (the server checks too)
  if (READ && READ.at && (Date.now() - READ.at) / 1000 > READ.read_max_age - 60)
    $('#cfg-at').innerHTML = '<span class="err">read is old: read again before writing</span>';
}, 30000);
$('#cfg-go').onclick = cfgRead;
$('#cfg-filter').oninput = drawCfg; $('#cfg-factory').onchange = drawCfg; $('#cfg-rawview').onchange = drawCfg;
$('#cfg-tabs').onclick = e => { const b = e.target.closest('button'); if (b) { curTab = b.dataset.t; curSub = null; history.replaceState(null, '', '#settings/' + curTab); drawCfg(); } };
$('#cfg-subtabs').onclick = e => { const b = e.target.closest('button'); if (b) { curSub = b.dataset.st; drawCfg(); } };
$('#cfg-out').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.off) { edited(t.dataset.off, t.checked ? 'Disabled' : (currentText(t.dataset.off) === 'Disabled' ? '00:00' : currentText(t.dataset.off))); drawCfg(); return; }
  if (!t.dataset.s) return;
  if (t.dataset.part) {       // power factor: number + direction make one value
    const td = t.closest('td'), num = td.querySelector('[data-part=num]'), dir = td.querySelector('[data-part=dir]');
    const [, , dec] = lim(t.dataset.s);
    num.value = held(t.dataset.s, num.value);
    edited(t.dataset.s, `${Number(num.value).toFixed(dec)} ${dir.value}`);
    drawCfg();
    return;
  }
  if (t.type === 'number') t.value = held(t.dataset.s, t.value);
  edited(t.dataset.s, t.value);
  drawCfg();
});
// SP LINK's number boxes (WinForms NumericUpDown) hold a typed value to their minimum / maximum and round it to their
// decimals; the same here, with a note. Limits set by another setting are left to the rule check.
// the limits after the pending changes (Battery Type, Float...) once checked; until then those from the read
const lim = name => ((CHECK && CHECK.limits) || READ.limits || {})[name] || [null, null, 0];
function held(name, text) {
  delete NOTES[name];
  const [mn, mx, dec] = lim(name);
  let v = parseFloat(text);
  if (!isFinite(v)) { NOTES[name] = 'not a number: kept the current value'; return String(parseFloat(READ.values[name].value)); }
  let note = '';
  if (mn != null && v < mn) { v = mn; note = `held to SP LINK's minimum ${mn}`; }
  if (mx != null && v > mx) { v = mx; note = `held to SP LINK's maximum ${mx}`; }
  const r = Number(v.toFixed(dec));
  if (!note && r !== v) note = `rounded to ${dec} decimal${dec === 1 ? '' : 's'}, as SP LINK does`;
  if (note) NOTES[name] = note;
  return String(r);
}

// ---- jobs
async function waitJob(job, out, done) {
  const t0 = Date.now();
  let misses = 0;
  while (true) {
    let j;
    try { j = await api('api/jobs/' + job.id); misses = 0; }
    catch (e) {   // page lost contact (HA reconnecting, app restarting): say so instead of freezing
      if (++misses > 40) { out.innerHTML = `<p class="err">lost contact with the app: ${esc(e.message)}</p>`; return; }
      out.insertAdjacentHTML('beforeend', misses === 1 ? `<p class="note">lost contact, retrying…</p>` : '');
      await new Promise(r => setTimeout(r, 3000));
      continue;
    }
    const s = Math.round((Date.now() - t0) / 1000);
    const elapsed = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    const p = j.progress;
    // a bar for jobs that report progress (log downloads); no value = indeterminate (searching / waiting)
    const bar = p === undefined && job.kind !== 'logs' ? '' :
      `<progress max="100" ${p && p.phase !== 'search' ? `value="${p.percent}"` : ''} style="width:100%"></progress>`;
    out.innerHTML = `${bar}<p class="note">${esc(j.message)} · ${elapsed}${p ? ` · ${Math.round(p.percent)}%` : ''}</p>`;
    if (j.state === 'done') return done(j);
    if (j.state === 'failed') { out.innerHTML = `<p class="err">${esc(j.message)}</p>`; return; }
    await new Promise(r => setTimeout(r, 1500));
  }
}

// ---- backups
async function loadBackups() {
  const [d, st] = await Promise.all([api('api/backups'), api('api/status')]);
  $('#bk-sched').textContent = st.backup_time ? `Daily backup at ${st.backup_time}.` : 'No daily backup scheduled.';
  const opts = d.backups.map(b => `<option value="${esc(b.name)}">${esc(b.name.replace('_', ' '))} (${esc(b.reason)})</option>`).join('');
  $('#bk-a').innerHTML = opts; $('#bk-b').innerHTML = opts;
  if (d.backups.length > 1) $('#bk-a').selectedIndex = 1;
  $('#bk-out').innerHTML = d.backups.length ? '<table>' + d.backups.map(b =>
    `<tr><td>${esc(b.name.replace('_', ' '))}</td><td class="muted">${esc(b.reason)}</td><td>${b.files.map(f =>
      `<a href="api/backups/${esc(b.name)}/${esc(f)}">${esc(f.split('_')[0])}</a>`).join(' · ')}</td></tr>`).join('') + '</table>'
    : '<p class="note" style="padding:0 12px">No backups yet.</p>';
}
$('#bk-go').onclick = async () => {
  $('#bk-go').disabled = true;
  try { const j = await api('api/backups', {method: 'POST'}); await waitJob(j, $('#diff-out'), () => { $('#diff-out').innerHTML = ''; loadBackups(); }); }
  catch (e) { $('#diff-out').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  $('#bk-go').disabled = false;
};
$('#bk-diff').onclick = async () => {
  try {
    const d = await api(`api/diff?a=${$('#bk-a').value}&b=${$('#bk-b').value}`);
    $('#diff-out').innerHTML = d.changes.length ? '<div class="scroll"><table><tr><th>Setting</th><th>Section</th><th></th><th class="num">Before</th><th class="num">After</th></tr>' +
      d.changes.map(c => `<tr><td>${esc(c.name)}</td><td class="muted">${esc(c.section)}</td><td class="addr">${esc(c.address)}</td><td class="num">${esc(c.a)}</td><td class="num">${esc(c.b)}</td></tr>`).join('') + '</table></div>'
      : '<p class="note" style="padding:0 12px">No differences.</p>';
  } catch (e) { $('#diff-out').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
};

// ---- logs
const today = new Date().toISOString().slice(0, 10);
$('#lg-since').value = today; $('#lg-until').value = today;
$('#lg-go').onclick = async () => {
  $('#lg-go').disabled = true;
  try {
    const j = await api('api/logs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
      since: $('#lg-since').value, until: $('#lg-until').value, logs: [...document.querySelectorAll('.lg:checked')].map(x => x.value)})});
    await waitJob(j, $('#lg-out'), j2 => {
      $('#lg-out').innerHTML = `<p class="ok">${esc(Object.entries(j2.result).map(([k, n]) => `${k}: ${n} rows`).join(', '))}</p>`;
      location.href = 'api/jobs/' + j2.id + '/file';
    });
  } catch (e) { $('#lg-out').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  $('#lg-go').disabled = false;
};

// ---- status
async function loadStatus() {
  const s = await api('api/status');
  const v = s.versions ? `settings ${s.versions.config_settings}/${s.versions.service_settings}, map ${s.versions.memory_map}, logs ${s.versions.event_log_format}/${s.versions.detailed_log_format}/${s.versions.daily_log_format}, comms card ${s.versions.comms_card_software}` : 'not read yet';
  $('#st-out').innerHTML = '<table>' + [
    ['Connection', `${s.connection} (${s.target})`],
    ['Unit versions', v + (s.version_problems.length ? ` <span class="err">— differs: ${esc(s.version_problems.join(', '))}</span>` : (s.versions ? ' <span class="ok">verified</span>' : ''))],
    ['Last good read', s.last_ok || '—'], ['Last error', s.last_error ? `<span class="err">${esc(s.last_error)}</span>` : '—'],
    ['Busy', s.busy || 'idle'], ['Backups', s.backups],
    ['Clock sync', !s.clock_sync ? 'off' : (s.clock.checked ? `checked ${s.clock.checked.slice(11, 19)}: ` + (s.clock.error ? 'error ' + s.clock.error : `drift ${s.clock.drift} s` + (s.clock.set_to != null ? `, set (now ${s.clock.set_to} s)` : '')) : 'on, first check soon')],
  ].map(([k, val]) => `<tr><th>${k}</th><td>${typeof val === 'string' && val.includes('<span') ? val : esc(val)}</td></tr>`).join('') + '</table>';
  $('#state').textContent = s.busy ? s.busy + '…' : (s.last_error ? 'error' : '');
}
{ const [t, sub] = location.hash.slice(1).split('/'); if (sub) curTab = sub; if (t && t !== 'live' && document.getElementById(t)) show(t); }
loadLive();
